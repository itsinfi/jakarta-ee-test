<!DOCTYPE html>
<html   
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
>
    <h:head>
        <title>Vom Ländle</title>
    </h:head>
    <h:body>
        <h:outputText value="Hello, JSF!" />
        
        <h1>Mais:</h1>
        <ul>
            <ui:repeat var="result" value="#{dbResults}">
                <li>#{result}</li>
            </ui:repeat>
        </ul>

        <h:form>
            <h:outputLabel value="sorte:"/>
            <h:inputText id="sorte" value="#{maisBean.sorte}"/>
            <br/>
            <h:outputLabel value="pflanzdatum:"/>
            <h:inputText id="pflanzdatum" value="#{maisBean.pflanzdatum}"/>
            <br/>
            <h:outputLabel value="erntezeit:"/>
            <h:inputText id="erntezeit" value="#{maisBean.erntezeit}"/>
            <br/>
            <h:outputLabel value="menge_tonnen:"/>
            <h:inputText id="menge_tonnen" value="#{maisBean.menge_tonnen}"/>
            <br/>
            <h:outputLabel value="feldnummer:"/>
            <h:inputText id="feldnummer" value="#{maisBean.feldnummer}"/>
            <br/>
            <h:outputLabel value="duengemittel:"/>
            <h:inputText id="duengemittel" value="#{maisBean.duengemittel}"/>
            <br/>
            <h:outputLabel value="anmerkungen:"/>
            <h:inputText id="anmerkungen" value="#{maisBean.anmerkungen}"/>
            <br/>

            <h:commandButton value="Save" action="#{maisBean.save}"/>
        </h:form>
    </h:body>
</html>
